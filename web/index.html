<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>天镜 SkyLens · 天气事实与成因解释</title>
    <meta
      name="description"
      content="多源天气事实包与可溯源解释：观测、预报、推断三层分开，每个数字可点回来源。"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1>天镜</h1>
        <span class="brand-en">SkyLens</span>
      </div>
      <form id="place-form" class="place-form">
        <input
          id="place"
          name="place"
          type="search"
          value="明安图镇"
          placeholder="地名，例如 明安图镇"
          autocomplete="off"
        />
        <button type="submit">查询</button>
      </form>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </header>

    <main class="layout">
      <section class="map-pane" aria-label="地图与云图">
        <div id="map"></div>
        <div class="map-overlay">
          <label class="toggle">
            <input id="cloud-toggle" type="checkbox" checked />
            <span>NASA GIBS 云图</span>
          </label>
          <span id="basemap-note" class="basemap-note"></span>
        </div>
        <div id="location-badge" class="location-badge" hidden></div>
      </section>

      <aside class="side-pane">
        <section id="fact-panel" class="card" aria-label="事实包">
          <h2>事实包</h2>
          <p class="muted">输入地名后加载。观测来自 METAR，预报来自 Open-Meteo 多模式。</p>
        </section>

        <section id="charts-panel" class="card" aria-label="天气图">
          <h2>天气图</h2>
          <p class="muted">加载中…</p>
        </section>

        <section class="card chat-card" aria-label="对话">
          <h2>问一句</h2>
          <div id="messages" class="messages"></div>
          <form id="ask-form" class="ask-form">
            <input
              id="question"
              type="text"
              placeholder="例如：明安图镇现在的天气及其成因？"
              autocomplete="off"
            />
            <button type="submit">问</button>
          </form>
          <p id="chat-note" class="muted small"></p>
        </section>
      </aside>
    </main>

    <footer class="disclaimer">
      本工具为个人天气数据可视化与解释工具，<strong>不发布天气预报</strong>。要素数据来自
      Open-Meteo / 和风天气，实况来自 METAR，天气图来自 JMA / 中央气象台，云图来自 NASA
      GIBS，底图为天地图；预警以官方发布为准并原样展示。成因解释为基于上述数据的推断，不构成预报结论。
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
